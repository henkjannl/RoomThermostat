; ES3C28P / ESP32-S3R8, 16 MB QSPI flash + 8 MB OPI PSRAM.
; Official PlatformIO platform 6.10.0 supplies Arduino-ESP32 2.0.17.
[platformio]
default_envs = usb-test

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; Match app and OTA metadata upload addresses to the custom partition table.
board_upload.offset_address = 0x20000
extra_scripts = post:../tools/cyd_upload_layout.py
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
board_build.filesystem = littlefs
build_flags =
    -I../shared/protocol/include
    -I../shared/ui/include
    -I../shared/assets/include
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CYD_TOUCH_MONITOR=1
lib_deps =
    adafruit/Adafruit ILI9341@1.6.2
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.16.2
    adafruit/Adafruit NeoPixel@1.12.3

; USB/external-power testing: mark records as externally powered.
[env:usb-test]
build_flags =
    ${env.build_flags}
    -D CYD_BATTERY_ONLY=0

; Standalone battery use: mark records as battery discharge measurements.
[env:battery]
build_flags =
    ${env.build_flags}
    -D CYD_BATTERY_ONLY=1
